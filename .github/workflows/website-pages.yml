# Publishes a preview of the Docusaurus website (activemq-website/website) to GitHub Pages.
# Enable it with Settings > Pages > Source: "GitHub Actions". GitHub Pages ignores .htaccess,
# so the redirects for the old URLs only work on the ASF hosted site.
name: Website Pages

on:
  push:
    branches: [ "website" ]
    paths: [ "activemq-website/**", ".github/workflows/website-pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: activemq-website/website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Same versions as activemq-website/pom.xml
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: activemq-website/website/pnpm-lock.yaml
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          # e.g. https://<owner>.github.io and /<repository>/, or the custom domain and /
          DOCUSAURUS_URL: ${{ steps.pages.outputs.origin }}
          DOCUSAURUS_BASE_URL: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: activemq-website/website/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
